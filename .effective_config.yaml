samples:
  SCL-1_normoxia:
    bam: /mnt/e/SCL-1_normoxia/alignment/FBF49260_pass_d756e6ad_00000000_0.bam
    condition: untreated
    oxygen: normoxia
  SCL-1_hypoxia:
    bam: /mnt/e/SCL-1_hypoxia/alignment/FBF64598_pass_3ceea3a1_00000000_0.bam
    condition: untreated
    oxygen: hypoxia
comparisons:
- control: SCL-1_normoxia
  treatment: SCL-1_hypoxia
modification_types:
- code: a
  name: m6A
  chebi: null
primary_modification: m6A
reference_fasta: reference/GRCh38.primary_assembly.genome.fa
gtf_annotation: reference/gencode.v47.annotation.gtf
thresholds:
  modification_probability: 191
  min_coverage: 10
  fdr_threshold: 0.05
  min_delta_stoichiometry: 0.1
ml:
  model_type: both
  test_size: 0.2
  random_state: 42
  n_estimators: 200
  max_depth: 6
output:
  base_dir: /mnt/e/results/results_SCL-1
  extraction_dir: /mnt/e/results/results_SCL-1/01_extraction
  stoichiometry_dir: /mnt/e/results/results_SCL-1/02_stoichiometry
  differential_dir: /mnt/e/results/results_SCL-1/03_differential
  features_dir: /mnt/e/results/results_SCL-1/04_features
  model_dir: /mnt/e/results/results_SCL-1/05_model
  shap_dir: /mnt/e/results/results_SCL-1/06_shap
  pathway_dir: /mnt/e/results/results_SCL-1/07_pathway
  figures_dir: /mnt/e/results/results_SCL-1/figures
processing:
  n_jobs: 4
  chunk_size: 10000
  verbose: true
